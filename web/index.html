<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CleanCode Agent</title>
    <link rel="stylesheet" href="/static/github.css" />
    <link rel="stylesheet" href="/static/styles.css?v=node-output-v1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body>
    <div id="app" v-cloak>
      <div class="app-layout" :class="{ 'history-unavailable': historyError && !historyEnabled }">
        <aside class="conversation-sidebar" v-if="historyEnabled || historyError">
          <div class="sidebar-header">
            <h2>历史会话</h2>
            <button type="button" title="新建会话" @click="startNewConversation"><i class="fa-solid fa-circle-plus"></i></button>
          </div>
          <div class="conversation-list">
            <div v-if="historyError" class="conversation-empty">{{ historyError }}</div>
            <div v-else-if="conversations.length === 0" class="conversation-empty">暂无会话</div>
            <div
              v-for="conversation in conversations"
              :key="conversation.id"
              class="conversation-row"
              :class="{ active: conversation.id === currentConversationId }"
            >
              <button type="button" class="conversation-item" @click="loadConversation(conversation.id)">
                <span class="conversation-title">{{ conversation.title || '新会话' }}</span>
                <span class="conversation-time">{{ formatTime(conversation.updated_at) }}</span>
              </button>
              <button type="button" class="conversation-delete" title="删除会话" @click="deleteConversation(conversation)"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>
        </aside>

        <main class="chat-panel">
          <header class="topbar">
            <div class="title-row">
              <h1>CleanCode Agent</h1>
              <p>{{ modelStatus }}</p>
            </div>
          </header>

          <section ref="messagesEl" class="messages" aria-live="polite">
            <article v-for="message in messages" :key="message.localId || message.id" class="message" :class="message.role">
              <div v-if="message.nodeOutputs && message.nodeOutputs.length" class="node-output-list">
                <details v-for="output in message.nodeOutputs" :key="output.localId" class="node-output" :open="output.open">
                  <summary><span>{{ output.title }}</span><span class="node-output-name">{{ output.node }}</span></summary>
                  <div class="node-output-body markdown-body" v-html="renderAssistantContent(output.content)"></div>
                </details>
              </div>
              <div v-if="message.role === 'assistant' || message.role === 'system'" class="message-body markdown-body" v-html="renderAssistantContent(message.content)"></div>
              <div v-else class="message-body">{{ message.content }}</div>
            </article>
          </section>

          <form class="composer" @submit.prevent="submitMessage">
            <textarea
              v-model="prompt"
              rows="4"
              placeholder="输入你的需求，例如：写一个 Python 函数，或基于右侧代码修改变量名..."
              :disabled="busy"
              @keydown="handleComposerKeydown"
              required
            ></textarea>
            <button type="submit" title="发送" :disabled="busy || !prompt.trim()"><i v-if="busy" class="fa-solid fa-spinner fa-spin"></i><i v-else class="fa-solid fa-paper-plane"></i></button>
          </form>
        </main>

        <aside class="code-panel">
          <header class="code-panel-header">
            <div>
              <h2>代码区</h2>
              <p>请选择项目文件夹并打开文件</p>
            </div>
            <div class="code-actions">
              <select class="theme-select" v-model="codeTheme" title="代码高亮主题">
                <option value="auto">跟随系统</option>
                <option value="clean-dark">清爽深色</option>
                <option value="github-light">GitHub 浅色</option>
                <option value="vs-dark">VS 深色</option>
                <option value="vs">VS 浅色</option>
              </select>
                            <button type="button" title="保存当前文件" @click="saveActiveFile" :disabled="!activeFile || savingFile"><i v-if="savingFile" class="fa-solid fa-spinner fa-spin"></i><i v-else class="fa-solid fa-floppy-disk"></i></button>
<button type="button" title="复制当前文件" @click="copyActiveFile" :disabled="!activeFile"><i class="fa-solid fa-copy"></i></button>
              <button type="button" title="运行 Python" @click="runActiveFile" :disabled="!canRunActiveFile || running"><i v-if="running" class="fa-solid fa-spinner fa-spin"></i><i v-else class="fa-solid fa-play"></i></button>
            </div>
          </header>

          <section class="workspace-controls">
            <form class="workspace-toolbar" @submit.prevent="openSelectedWorkspaceFile">
              <button type="button" class="folder-button" title="选择项目目录" @click="chooseWorkspaceDirectory" :disabled="!supportsLocalDirectoryPicker || openingWorkspace"><i v-if="openingWorkspace" class="fa-solid fa-spinner fa-spin"></i><i v-else class="fa-solid fa-folder-open"></i></button>
              <select v-model="selectedWorkspaceFile" :disabled="openingFile || !workspaceEntries.length">
                <option value="" disabled>选择文件</option>
                <option v-for="entry in workspaceEntries" :key="entry.path" :value="entry.path">{{ entry.path }}</option>
              </select>
              <button type="submit" title="打开文件" :disabled="openingFile || !selectedWorkspaceFile"><i v-if="openingFile" class="fa-solid fa-spinner fa-spin"></i><i v-else class="fa-solid fa-file-code"></i></button>
            </form>
            <p v-if="workspaceStatus">{{ workspaceStatus }}</p>
          </section>

          <div v-if="workspace.files.length" class="file-tabs" role="tablist">
            <button
              v-for="file in workspace.files"
              :key="file.path"
              type="button"
              class="file-tab"
              :class="{ active: file.path === workspace.active_file }"
              @click="workspace.active_file = file.path"
            ><span class="file-tab-label">{{ file.path }}</span><span class="file-tab-close" title="Close file" @click.stop="closeWorkspaceFile(file.path)"><i class="fa-solid fa-xmark"></i></span></button>
          </div>

          <div
            v-if="activeFile && !monacoLoadError"
            ref="codeEditorEl"
            class="code-editor monaco-editor-host"
          ></div>
          <textarea
            v-else-if="activeFile"
            class="code-editor fallback-code-editor"
            spellcheck="false"
            :value="activeFile.content"
            @input="updateActiveFile($event.target.value)"
          ></textarea>
          <div v-if="activeFile && monacoLoadError" class="editor-error">{{ monacoLoadError }}</div>
          <div v-else-if="!activeFile" class="empty-code-state">
            <strong>暂无代码</strong>
            <span>请选择项目文件夹并打开文件</span>
          </div>

          <section v-if="patchProposal || patchStatus" class="patch-panel">
            <div class="patch-panel-header"><span>Patch 提议</span><button type="button" title="Close patch proposal" @click="discardPatchProposal"><i class="fa-solid fa-xmark"></i></button></div>
            <p v-if="patchProposal">{{ patchProposal.summary }}</p>
            <p v-else>{{ patchStatus }}</p>
            <div v-if="patchProposal" class="patch-actions">
              <button type="button" @click="applyPatchProposal"><i class="fa-solid fa-check"></i><span>应用</span></button>
              <button type="button" @click="discardPatchProposal"><i class="fa-solid fa-xmark"></i><span>取消</span></button>
            </div>
          </section>

          <section v-if="runOutput" class="run-output">
            <div class="run-output-header"><span>运行结果</span><button type="button" title="Close output" @click="clearRunOutput"><i class="fa-solid fa-xmark"></i></button></div>
            <pre>{{ runOutput }}</pre>
          </section>
        </aside>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="/static/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <script src="/static/app.js?v=node-output-v1"></script>
  </body>
</html>
